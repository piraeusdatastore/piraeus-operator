name: release.yml
on:
  push:
    tags:
    - "v*.*.*"

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build release resources
        run: |
          make manifest.yaml changes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: changes.md
          draft: true
          files: |
            manifest.yaml
