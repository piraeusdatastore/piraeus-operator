---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linstor-csi-nfs-server
  labels:
    app.kubernetes.io/component: linstor-csi-nfs-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linstor-csi-nfs-server
  labels:
    app.kubernetes.io/component: linstor-csi-nfs-server
rules:
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  - endpointslices/restricted # for openshift
  verbs:
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - linstor-csi-nfs-server-reactor-config
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  resourceNames:
  - privileged
  verbs:
  - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linstor-csi-nfs-server
  labels:
    app.kubernetes.io/component: linstor-csi-nfs-server
subjects:
- kind: ServiceAccount
  name: linstor-csi-nfs-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linstor-csi-nfs-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linstor-csi-nfs-server
  labels:
    app.kubernetes.io/component: linstor-csi-nfs-server
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linstor-csi-nfs-server
  labels:
    app.kubernetes.io/component: linstor-csi-nfs-server
subjects:
- kind: ServiceAccount
  name: linstor-csi-nfs-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: linstor-csi-nfs-server
