---
- target:
    group: apps
    version: v1
    kind: Deployment
    name: linstor-affinity-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: linstor-affinity-controller
    spec:
      template:
        spec:
          containers:
          - name: linstor-affinity-controller
            volumeMounts:
            - name: linstor-client-tls
              mountPath: /etc/linstor/tls
              readOnly: true
            env:
            - name: LS_ROOT_CA
              valueFrom: $LINSTOR_AFFINITY_CONTROLLER_API_TLS_CA_SOURCE
            - name: LS_USER_CERTIFICATE_FILE
              value: /etc/linstor/tls/tls.crt
            - name: LS_USER_KEY_FILE
              value: /etc/linstor/tls/tls.key
          volumes:
          - name: linstor-client-tls
            secret:
              secretName: $LINSTOR_AFFINITY_CONTROLLER_API_TLS_SECRET_NAME
