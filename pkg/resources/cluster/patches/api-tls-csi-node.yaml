---
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: linstor-csi-node
  patch: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: linstor-csi-node
    spec:
      template:
        spec:
          initContainers:
          - name:  linstor-wait-node-online
            volumeMounts:
            - name: linstor-client-tls
              mountPath: /etc/linstor/tls
              readOnly: true
            env:
            - name: LS_ROOT_CA
              valueFrom: $LINSTOR_CSI_NODE_API_TLS_CA_SOURCE
            - name: LS_USER_CERTIFICATE_FILE
              value: /etc/linstor/tls/tls.crt
            - name: LS_USER_KEY_FILE
              value: /etc/linstor/tls/tls.key
          containers:
          - name: linstor-csi
            volumeMounts:
            - name: linstor-client-tls
              mountPath: /etc/linstor/tls
              readOnly: true
            env:
            - name: LS_ROOT_CA
              valueFrom: $LINSTOR_CSI_NODE_API_TLS_CA_SOURCE
            - name: LS_USER_CERTIFICATE_FILE
              value: /etc/linstor/tls/tls.crt
            - name: LS_USER_KEY_FILE
              value: /etc/linstor/tls/tls.key
          volumes:
          - name: linstor-client-tls
            secret:
              secretName: $LINSTOR_CSI_NODE_API_TLS_SECRET_NAME
