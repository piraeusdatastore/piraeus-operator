---
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: linstor-csi-nfs-server
  patch: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: linstor-csi-nfs-server
    spec:
      template:
        spec:
          initContainers:
          - name:  linstor-wait-node-online
            env:
              - name: LS_ROOT_CA
                valueFrom: $LINSTOR_CSI_NFS_SERVER_API_TLS_CA_SOURCE
              - name: LS_USER_CERTIFICATE
                valueFrom:
                  secretKeyRef:
                    name: $LINSTOR_CSI_NFS_SERVER_API_TLS_SECRET_NAME
                    key: tls.crt
              - name: LS_USER_KEY
                valueFrom:
                  secretKeyRef:
                    name: $LINSTOR_CSI_NFS_SERVER_API_TLS_SECRET_NAME
                    key: tls.key
