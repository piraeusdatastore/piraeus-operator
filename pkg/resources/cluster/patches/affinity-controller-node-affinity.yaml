---
- target:
    group: apps
    version: v1
    kind: Deployment
    name: linstor-affinity-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: linstor-affinity-controller
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution: $NODE_AFFINITY
